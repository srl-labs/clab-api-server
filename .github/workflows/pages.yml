name: Publish Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish docs to gh-pages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build documentation
        run: scripts/docs.sh build

      - name: Prepare static site
        run: |
          set -euo pipefail
          rm -rf public
          cp -R site public
          # Keep the spec at its old root URLs for existing links.
          cp docs/swagger.json docs/swagger.yaml public/
          touch public/.nojekyll

      - name: Publish to gh-pages
        run: |
          set -euo pipefail

          repo_dir="$PWD"
          publish_dir="$(mktemp -d)"
          cleanup() {
            cd "$repo_dir"
            git worktree remove --force "$publish_dir" >/dev/null 2>&1 || rm -rf "$publish_dir"
          }
          trap cleanup EXIT

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1

          git worktree add "$publish_dir" origin/gh-pages
          # Replace the previous site entirely so removed pages do not linger.
          find "$publish_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a public/. "$publish_dir"/

          cd "$publish_dir"
          git add -A
          if git diff --cached --quiet; then
            echo "No docs changes to publish."
            exit 0
          fi

          git commit -m "publish docs"
          git push origin HEAD:gh-pages
