      description: |-
        Saves VM snapshots of vrnetlab-based nodes, like `containerlab tools snapshot save`. Each snapshot is written to `<outputDir>/<node>.tar`; non-vrnetlab nodes are skipped.

        **Notes**
        - `outputDir` is relative to the lab's topology directory (or absolute) and must stay inside the user's workspace, or the shared root for shared labs. Defaults to `snapshots`.
