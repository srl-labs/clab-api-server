    - newPath
    - oldPath
    type: object
info:
  contact:
    name: Containerlab API Server maintainers
    url: https://github.com/srl-labs/clab-api-server/issues
  description: |-
    REST API for authenticated Linux users to manage Containerlab deployments, topology files, node access, captures, and host networking tools.

    Most endpoints under /api/v1 require a JWT from POST /login. Send it as: Authorization: Bearer <token>.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Containerlab API Server
  version: "1.0"
paths:
  /api/v1/capture/wireshark-vnc-sessions:
    delete:
      description: Terminates all capture VNC sessions owned by the authenticated
        user. Superusers terminate all sessions.
      produces:
      - application/json
      responses:
        "200":
          description: Capture sessions terminated
          schema:
            $ref: '#/definitions/models.CaptureCloseAllResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete all Wireshark VNC sessions
      tags:
      - Capture
  /api/v1/capture/wireshark-vnc-sessions/{sessionId}:
    delete:
      description: Terminates a capture VNC session and stops the corresponding Wireshark
        container.
      parameters:
      - description: Capture session ID
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Capture session terminated
          schema:
            $ref: '#/definitions/models.GenericSuccessResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Session not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete Wireshark VNC session
      tags:
      - Capture
  /api/v1/capture/wireshark-vnc-sessions/{sessionId}/ready:
    get:
      description: Returns whether a capture VNC session is ready and its proxied
        URL path.
      parameters:
      - description: Capture session ID
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Readiness state
          schema:
            $ref: '#/definitions/models.CaptureWiresharkVncReadyResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Session not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Wireshark VNC session readiness
      tags:
      - Capture
  /api/v1/capture/wireshark-vnc-sessions/{sessionId}/vnc/{proxyPath}:
    get:
      description: Proxies noVNC HTTP assets for a capture session. WebSocket upgrades
        on this path are used by noVNC but are not represented in Swagger.
      parameters:
      - description: Capture session ID
        in: path
        name: sessionId
        required: true
        type: string
      - description: Proxy subpath under the noVNC root
        in: path
        name: proxyPath
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: Proxied noVNC asset response
          schema:
            type: string
        "400":
          description: Invalid request
          schema:
