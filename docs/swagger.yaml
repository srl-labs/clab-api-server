          to running topology path or <labName>.clab.yml)
        in: query
        name: path
        type: string
      - description: Show apply actions without applying them
        in: query
        name: dryRun
        type: boolean
      - description: Limit concurrent workers for new nodes
        in: query
        name: maxWorkers
        type: integer
      - description: Custom Go template file for topology data export
        in: query
        name: exportTemplate
        type: string
      - description: Skip post-deploy actions for added nodes
        in: query
        name: skipPostDeploy
        type: boolean
      - description: Stream lifecycle output as NDJSON events
        in: query
        name: stream
        type: boolean
      - description: Include captured lifecycle logs in the JSON response
        in: query
        name: includeLogs
        type: boolean
      - description: containerlab timeout like --timeout, a Go duration such as 10m
          or 1h; at most 2h. Defaults to 10m on c9s and 5m with Docker and Podman
        in: query
        name: timeout
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Apply result
          schema:
