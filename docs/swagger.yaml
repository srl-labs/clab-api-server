        type: string
      - description: containerlab timeout like --timeout, a Go duration such as 10m
          or 1h; at most 2h. Defaults to 10m on c9s and 5m with Docker and Podman
        in: query
        name: timeout
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Redeployed lab details
          schema:
            $ref: '#/definitions/models.ClabInspectOutput'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/models.ErrorResponse'
