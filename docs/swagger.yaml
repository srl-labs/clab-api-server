definitions:
  models.ApplyLabResponse:
    properties:
      addedLinks:
        items:
          type: string
        type: array
      addedNodes:
        items:
          type: string
        type: array
      deletedEndpoints:
        items:
          type: string
        type: array
      deletedNodes:
        items:
          type: string
        type: array
      deployedLab:
        type: boolean
      dryRun:
        type: boolean
      labName:
        type: string
      nodeChangeReasons:
        additionalProperties:
          type: string
        type: object
      recreatedNodes:
        items:
          type: string
        type: array
      restartedNodes:
        items:
          type: string
        type: array
      runtimePlan:
        allOf:
        - $ref: '#/definitions/models.LabRuntimePlan'
        description: RuntimePlan is the remote resource plan of a dry run on a lab
          runtime (c9s).
      startedNodes:
        items:
          type: string
        type: array
    type: object
  models.CACreateRequest:
    properties:
      commonName:
        description: Defaults to "containerlab.dev"
        example: ca.example.com
        type: string
      country:
        description: Defaults to "Internet"
        example: US
        type: string
      expiry:
        description: Duration string, defaults to "87600h" (10 years)
        example: 8760h
        type: string
      locality:
        description: Defaults to "Server"
        example: City
        type: string
      name:
        description: Defaults to "ca" if empty
        example: my-root-ca
        type: string
      orgUnit:
        description: Defaults to "Containerlab Tools"
        example: IT
        type: string
      organization:
        description: Defaults to "Containerlab"
        example: MyOrg
        type: string
    type: object
  models.CPUMetrics:
    properties:
      loadAvg1:
        description: 1-minute load average
        type: number
      loadAvg5:
        description: 5-minute load average
        type: number
      loadAvg15:
        description: 15-minute load average
        type: number
      numCPU:
        description: Number of CPUs/cores
        type: integer
      processPercent:
        description: This process's CPU usage
        type: number
      usagePercent:
        description: Overall CPU usage percentage
        type: number
    type: object
  models.CaptureCloseAllResponse:
    properties:
      closed:
        type: integer
      message:
        type: string
    type: object
  models.CapturePacketflixRequest:
    properties:
      remoteHostname:
        type: string
      targets:
        items:
          $ref: '#/definitions/models.CaptureTarget'
        minItems: 1
        type: array
    required:
    - targets
    type: object
  models.CapturePacketflixResponse:
    properties:
      captures:
        items:
          $ref: '#/definitions/models.CapturePacketflixURI'
        type: array
    type: object
  models.CapturePacketflixURI:
    properties:
      containerName:
        type: string
      interfaceNames:
        items:
          type: string
        type: array
      packetflixUri:
        type: string
    type: object
  models.CaptureTarget:
    properties:
      containerName:
        type: string
      interfaceName:
        type: string
      nodeNamespace:
        description: |-
          NodeNamespace marks InterfaceName as the port's name inside the node's
          network namespace. It is captured there as-is, instead of being resolved
          through its alias to the host-side end of a stitched link, so a node's
          links and its own interfaces (e.g. eth0) can share one capture stream.
        type: boolean
    required:
    - containerName
    - interfaceName
    type: object
  models.CaptureWiresharkVncCreateResponse:
    properties:
      sessions:
        items:
          $ref: '#/definitions/models.CaptureWiresharkVncSession'
        type: array
    type: object
  models.CaptureWiresharkVncReadyResponse:
    properties:
      ready:
        type: boolean
      url:
        type: string
    type: object
  models.CaptureWiresharkVncRequest:
    properties:
      targets:
        items:
          $ref: '#/definitions/models.CaptureTarget'
        minItems: 1
        type: array
      theme:
        type: string
    required:
    - targets
    type: object
  models.CaptureWiresharkVncSession:
    properties:
      containerName:
        type: string
      createdAt:
        type: string
      expiresAt:
        type: string
      interfaceNames:
        items:
          type: string
        type: array
      labName:
        type: string
      sessionId:
        type: string
      showVolumeTip:
        type: boolean
      vncPath:
        type: string
    type: object
  models.CertResponse:
    properties:
      certPath:
        description: e.g., "my-root-ca/my-root-ca.pem" or "my-root-ca/node1.example.com.pem"
        type: string
      csrPath:
        description: e.g., "my-root-ca/my-root-ca.csr" or "my-root-ca/node1.example.com.csr"
        type: string
      keyPath:
        description: e.g., "my-root-ca/my-root-ca.key" or "my-root-ca/node1.example.com.key"
        type: string
      message:
        type: string
    type: object
  models.CertSignRequest:
    properties:
      caName:
        description: Name of the CA cert/key files (without .pem/.key) previously
          generated
        example: my-root-ca
        type: string
      commonName:
        description: Defaults to Name if empty
        example: node1.example.com
        type: string
      country:
        description: Defaults to "Internet"
        example: US
        type: string
      hosts:
        description: SANs (DNS names or IPs), comma-separated in clab, array here
        items:
          type: string
        type: array
      keySize:
        description: Defaults to 2048
        example: 4096
        type: integer
      locality:
        description: Defaults to "Server"
        example: City
        type: string
      name:
        description: Required
        example: node1.example.com
        type: string
      orgUnit:
        description: Defaults to "Containerlab Tools"
        example: Nodes
        type: string
      organization:
        description: Defaults to "Containerlab"
        example: MyOrg
        type: string
    required:
    - caName
    - hosts
    - name
    type: object
  models.ClabContainerInfo:
    properties:
      absLabPath:
        description: Absolute path to topology file
        type: string
      container:
        description: Container is the node's primary device container in the Pod.
        example: node-srl1-6b1f
        type: string
      container_id:
        description: Docker container ID (short)
        type: string
      exposed_ports:
        description: ExposedPorts are the node ports published through the node's
          Service.
        items:
          $ref: '#/definitions/models.ClabExposedPort'
        type: array
      group:
        description: Group assigned in topology (Might not always be present)
        type: string
      image:
        description: Container image used
        type: string
      ipv4_address:
        description: Management IPv4 Address/Mask
        type: string
      ipv6_address:
        description: Management IPv6 Address/Mask
        type: string
      kind:
        description: e.g., "linux", "nokia_srlinux"
        type: string
      lab_name:
        description: Name of the lab this node belongs to (redundant with map key
          but present)
        type: string
      labPath:
        description: Path to the topology file used (relative)
        type: string
      load_balancer_address:
        description: LoadBalancerAddress is the address of the LoadBalancer Service
          that exposes the node.
        example: 203.0.113.10
        type: string
      mgmt_network:
        description: |-
          MgmtNetwork is the management network the node is attached to; with
          several management networks (mgmt list in the topology) it tells them apart.
        example: clab
        type: string
      name:
        description: Name of the container node (e.g., "lab01-client1")
        type: string
      namespace:
        description: Namespace is the Kubernetes namespace of the lab.
        example: c9s-alice-lab01
        type: string
      node_uid:
        description: NodeUID is the UID of the clabernetes Node resource.
        type: string
      nodeName:
        description: Topology node name from containerlab labels
        type: string
      owner:
        description: OS user from clab inspect output (Used for authorization)
        type: string
      pod:
        description: Pod is the Pod that runs the node.
        example: lab01-srl1-5c9d8f7b6-x2x7k
        type: string
      ports:
        description: Published ports, as in `clab inspect --format json`
        items:
          $ref: '#/definitions/models.ClabPortBinding'
        type: array
      state:
        description: e.g., "running"
        type: string
      status:
        description: e.g., "Up 18 hours"
        type: string
    type: object
  models.ClabExecInternalResult:
    properties:
      cmd:
        description: The command and its arguments as executed
        items:
          type: string
        type: array
      return-code:
        description: Exit code of the command inside the container
        type: integer
      stderr:
        description: Standard error of the command
        type: string
      stdout:
        description: Standard output of the command
        type: string
    type: object
  models.ClabExposedPort:
    properties:
      expose_port:
        example: 22
        type: integer
      port:
        example: 22
        type: integer
      protocol:
        example: tcp
        type: string
    type: object
  models.ClabInspectOutput:
    additionalProperties:
      items:
        $ref: '#/definitions/models.ClabContainerInfo'
      type: array
    type: object
  models.ClabPortBinding:
    properties:
      host_ip:
        example: 0.0.0.0
        type: string
      host_port:
        example: 8080
        type: integer
      port:
        example: 80
        type: integer
      protocol:
        example: tcp
        type: string
    type: object
  models.CustomIconInfo:
    properties:
      dataUri:
        type: string
      format:
        example: svg
        type: string
      name:
        type: string
      source:
        example: global
        type: string
    type: object
  models.CustomNodeDefaultRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  models.CustomNodeTemplate:
    additionalProperties: true
    type: object
  models.CustomNodesReplaceRequest:
    properties:
      customNodes:
        items:
          $ref: '#/definitions/models.CustomNodeTemplate'
        type: array
    type: object
  models.CustomNodesResponse:
    properties:
      customNodes:
        items:
          $ref: '#/definitions/models.CustomNodeTemplate'
        type: array
      defaultNode:
        type: string
    type: object
  models.DeployRequest:
    properties:
      topologyContent:
        description: "Option 1: Direct Topology Content.\nProvide the full containerlab
          topology YAML as a json string.\nIf this is provided, 'topologySourceUrl'
          MUST be empty.\n{\n\t\"topologyContent\": {\n\t  \"name\": \"your-lab-name\",\n\t
          \ \"topology\": {\n\t\t\"kinds\": {\n\t\t  \"nokia_srlinux\": {\n\t\t\t\"type\":
          \"ixrd3\",\n\t\t\t\"image\": \"ghcr.io/nokia/srlinux\"\n\t\t  }\n\t\t},\n\t\t\"nodes\":
          {\n\t\t  \"srl1\": {\n\t\t\t\"kind\": \"nokia_srlinux\"\n\t\t  },\n\t\t
          \ \"srl2\": {\n\t\t\t\"kind\": \"nokia_srlinux\"\n\t\t  }\n\t\t},\n\t\t\"links\":
          [\n\t\t  {\n\t\t\t\"endpoints\": [\n\t\t\t  \"srl1:e1-1\",\n\t\t\t  \"srl2:e1-1\"\n\t\t\t]\n\t\t
          \ }\n\t\t]\n\t  }\n\t}\n  }"
        type: object
      topologySourceUrl:
        description: |-
          Option 2: Remote Topology Source URL.
          Provide a URL to a Git repository, a specific .clab.yml file in Git (github/gitlab), or a raw HTTP(S) URL.
          If this is provided, 'topologyContent' MUST be empty.
        type: string
    type: object
  models.DisableTxOffloadRequest:
    properties:
      containerName:
        example: clab-my-lab-srl1
        type: string
    required:
    - containerName
    type: object
  models.DiskMetrics:
    properties:
      freeDisk:
        description: Free disk space in bytes
        type: integer
      path:
        description: Mount path (usually "/")
        type: string
      totalDisk:
        description: Total disk space in bytes
        type: integer
      usagePercent:
        description: Disk usage percentage
        type: number
      usedDisk:
        description: Used disk space in bytes
        type: integer
    type: object
  models.DrawioGenerateRequest:
    properties:
      layout:
        example: horizontal
        type: string
      theme:
        example: nokia_modern
        type: string
    type: object
  models.DrawioGenerateResponse:
    properties:
      content:
        type: string
      fileName:
        type: string
      layout:
        type: string
      message:
        type: string
      output:
        type: string
    type: object
  models.EdgeSharkStatusResponse:
    properties:
      packetflixPort:
        type: integer
      running:
        type: boolean
      runtime:
        type: string
      version:
        type: string
    type: object
  models.ErrorResponse:
    properties:
      error:
        example: Invalid credentials or user not in allowed group
        type: string
    type: object
  models.EventAttributes:
    properties:
      clab-node-kind:
        description: Node kind (e.g., nokia_srlinux, linux)
        example: nokia_srlinux
        type: string
      clab-node-name:
        description: Node name within the lab
        example: srl1
        type: string
      clab-node-type:
        description: Node type
        example: ixrd3
        type: string
      containerlab:
        description: Alternative lab name field (containerlab label)
        example: mylab
        type: string
      exitCode:
        description: Exit code (for stop/die events)
        example: "0"
        type: string
      image:
        description: Container image
        example: ghcr.io/nokia/srlinux:latest
        type: string
      lab:
        description: Lab name this event belongs to
        example: mylab
        type: string
      name:
        description: Container name
        example: clab-mylab-srl1
        type: string
    type: object
  models.EventResponse:
    properties:
      action:
        description: Event action (e.g., "start", "stop", "die", "stats")
        example: start
        type: string
      attributes:
        allOf:
        - $ref: '#/definitions/models.EventAttributes'
        description: Event attributes containing details about the event
      time:
        description: Unix timestamp when the event occurred
        example: 1706918400
        type: integer
      type:
        description: Type of event (e.g., "container", "interface-stats")
        example: container
        type: string
    type: object
  models.ExecRequest:
    properties:
      command:
        example: ip addr show eth1
        type: string
    required:
    - command
    type: object
  models.ExecResponse:
    additionalProperties:
      items:
        $ref: '#/definitions/models.ClabExecInternalResult'
      type: array
    type: object
  models.FcliCommandRequest:
    properties:
      command:
        type: string
    required:
    - command
    type: object
  models.FcliCommandResponse:
    properties:
      command:
        type: string
      output:
        type: string
    type: object
  models.GenerateNodeTier:
    properties:
      count:
        description: Number of nodes in this tier
        example: 4
        minimum: 1
        type: integer
      kind:
        description: Node kind (defaults to 'srl'/'nokia_srlinux' if omitted)
        example: nokia_srlinux
        type: string
      type:
        description: Node type within the kind
        example: ixrd3
        type: string
    required:
    - count
    type: object
  models.GenerateRequest:
    properties:
      defaultKind:
        example: nokia_srlinux
        type: string
      deploy:
        example: true
        type: boolean
      groupPrefix:
        example: clos-tier
        type: string
      images:
        additionalProperties:
          type: string
        example:
          nokia_srlinux: ghcr.io/nokia/srlinux:latest
        type: object
      ipv4Subnet:
        example: 172.20.20.0/24
        type: string
      ipv6Subnet:
        example: 2001:172:20:20::/64
        type: string
      licenses:
        additionalProperties:
          type: string
        example:
          nokia_srlinux: /opt/licenses/srl.lic
        type: object
      managementNetwork:
        example: clos-mgmt
        type: string
      maxWorkers:
        example: 4
        type: integer
      name:
        example: 3-tier-clos
        type: string
      nodePrefix:
        example: clos-node
        type: string
      outputFile:
        example: clos.yml
        type: string
      tiers:
        items:
          $ref: '#/definitions/models.GenerateNodeTier'
        minItems: 1
        type: array
    required:
    - name
    - tiers
    type: object
  models.GenerateResponse:
    properties:
      deployOutput:
        description: |-
          The output from the deploy command (only if Deploy=true). JSON object keyed by lab name.
          Use swaggertype:"object" to represent json.RawMessage in Swagger.
        type: object
      message:
        description: Message indicating success or failure.
        type: string
      savedFilePath:
        description: Path where the file was saved (if Deploy=true, it's the path
          in the user's managed lab directory; if Deploy=false, it's the OutputFile
          path if provided).
        type: string
      topologyYaml:
        description: The generated topology YAML (only if Deploy=false and OutputFile
          is empty).
        type: string
    type: object
  models.GenericSuccessResponse:
    properties:
      message:
        type: string
    type: object
  models.GoTTYShareRequest:
    properties:
      password:
        example: secret
        type: string
      port:
        example: 8080
        type: integer
      shell:
        example: bash
        type: string
      username:
        example: admin
        type: string
    type: object
  models.GraphExportRequest:
    properties:
      direction:
        description: 'Direction of the mermaid flowchart: TD, TB, BT, RL or LR (default
          TD).'
        example: TD
        type: string
    type: object
  models.GraphExportResponse:
    properties:
      content:
        type: string
      direction:
        example: TD
        type: string
      fileName:
        example: lab01.clab.mermaid
        type: string
      format:
        enum:
        - mermaid
        - dot
        example: mermaid
        type: string
      output:
        type: string
    type: object
  models.HealthResponse:
    properties:
      features:
        description: |-
          Features lists optional API features this server supports, so clients can
          hide what older servers do not provide.
        example:
        - validate
        - exec-filters
        items:
          type: string
        type: array
      namespaceMode:
        description: |-
          NamespaceMode is how c9s labs get namespaces: per-lab (one namespace per lab) or
          fixed (one namespace for every lab). It is only set for c9s.
        enum:
        - per-lab
        - fixed
        example: per-lab
        type: string
      runtime:
        description: 'Runtime is the lab runtime the server runs labs with: docker,
          podman or c9s.'
        enum:
        - docker
        - podman
        - c9s
        example: docker
        type: string
      startTime:
        description: When the server started
        type: string
      status:
        description: '"healthy" or other status indicators'
        type: string
      uptime:
        description: Human-readable uptime
        type: string
      version:
        description: API server version
        type: string
    type: object
  models.IconListResponse:
    properties:
      icons:
        items:
          $ref: '#/definitions/models.CustomIconInfo'
        type: array
    type: object
  models.IconReconcileRequest:
    properties:
      usedIcons:
        items:
          type: string
        type: array
    type: object
  models.IconUploadRequest:
    properties:
      contentType:
        example: image/svg+xml
        type: string
      dataBase64:
        type: string
      fileName:
        example: my-router.svg
        type: string
    required:
    - dataBase64
    - fileName
    type: object
  models.IconUploadResponse:
    properties:
      iconName:
        example: my-router
        type: string
      success:
        example: true
        type: boolean
    type: object
  models.ImportTopologyFromURLRequest:
    properties:
      topologySourceUrl:
        type: string
    required:
    - topologySourceUrl
    type: object
  models.ImportTopologyFromURLResponse:
    properties:
      fileName:
        type: string
      labName:
        type: string
      success:
        type: boolean
      topology:
        $ref: '#/definitions/models.TopologyEntry'
    type: object
  models.InterfaceInfo:
    properties:
      alias:
        description: Interface alias (e.g., "ethernet-1/1", "" if none)
        type: string
      ifindex:
        description: Interface index
        type: integer
      mac:
        description: MAC Address
        type: string
      mtu:
        description: MTU size
        type: integer
      name:
        description: Interface name (e.g., "eth0", "e1-1")
        type: string
      state:
        description: Interface state (e.g., "up", "down", "unknown")
        type: string
      type:
        description: Interface type (e.g., "veth", "device", "dummy")
        type: string
    type: object
  models.LabLink:
    properties:
      a:
        $ref: '#/definitions/models.LinkEndpoint'
      b:
        $ref: '#/definitions/models.LinkEndpoint'
      type:
        description: |-
          Link type: "veth" for veth pairs, "macvlan" for macvlan interfaces whose
          B endpoint is the parent interface.
        example: veth
        type: string
    type: object
  models.LabRuntimePlan:
    properties:
      changes:
        items:
          $ref: '#/definitions/models.LabRuntimePlanChange'
        type: array
      namespace:
        example: c9s-alice-lab01
        type: string
    type: object
  models.LabRuntimePlanChange:
    properties:
      action:
        example: recreate
        type: string
      kind:
        example: Node
        type: string
      name:
        example: srl1
        type: string
      namespace:
        type: string
    type: object
  models.LabStatsSample:
    properties:
      intervalSeconds:
        description: IntervalSeconds is the time between samples.
        example: 2
        type: number
      nodes:
        items:
          $ref: '#/definitions/models.NodeStats'
        type: array
      time:
        type: string
      type:
        description: Type is always "stats".
        example: stats
        type: string
    type: object
  models.LinkEndpoint:
    properties:
      alias:
        description: Interface alias (e.g. "ethernet-1/1").
        example: ethernet-1/1
        type: string
      container:
        description: Container name, set when Namespace is "node".
        example: clab-mylab-srl1
        type: string
      ifindex:
        description: Interface index inside its namespace.
        example: 12
        type: integer
      interface:
        description: Interface name, empty when the interface could not be looked
          up.
        example: e1-1
        type: string
      mac:
        example: aa:c1:ab:00:00:01
        type: string
      master:
        description: Device the interface is enslaved to, such as a bridge.
        example: br-clab
        type: string
      mtu:
        example: 9500
        type: integer
      namespace:
        description: 'Namespace the interface lives in: "node", "host" or "external".'
        example: node
        type: string
      node:
        description: Topology node name, set when Namespace is "node".
        example: srl1
        type: string
      state:
        example: up
        type: string
    type: object
  models.LoginRequest:
    properties:
      password:
        type: string
      sessionDuration:
        example: 24h
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  models.LoginResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VybmFtZSI6ImFkbWluIiwiZXhwIjoxNzA2OTIyMDAwfQ.abc123
        type: string
    type: object
  models.LogsResponse:
    properties:
      containerName:
        type: string
      logs:
        type: string
    type: object
  models.MemMetrics:
    properties:
      availableMem:
        description: Available memory in bytes
        type: integer
      processMemMB:
        description: This process's memory in MB
        type: number
      processMemPct:
        description: This process's memory percentage
        type: number
      totalMem:
        description: Total physical memory in bytes
        type: integer
      usagePercent:
        description: Memory usage percentage
        type: number
      usedMem:
        description: Used physical memory in bytes
        type: integer
    type: object
  models.Metrics:
    properties:
      cpu:
        allOf:
        - $ref: '#/definitions/models.CPUMetrics'
        description: CPU usage metrics
      disk:
        allOf:
        - $ref: '#/definitions/models.DiskMetrics'
        description: Disk usage metrics
      mem:
        allOf:
        - $ref: '#/definitions/models.MemMetrics'
        description: Memory usage metrics
    type: object
  models.MetricsResponse:
    properties:
      metrics:
        allOf:
        - $ref: '#/definitions/models.Metrics'
        description: Detailed system metrics
      serverInfo:
        allOf:
        - $ref: '#/definitions/models.ServerInfo'
        description: Basic server information
    type: object
  models.NetemInterfaceInfo:
    properties:
      corruption:
        description: Percentage (might be missing in older clab versions)
        type: number
      delay:
        description: Duration string or empty
        type: string
      interface:
        description: Interface name
        type: string
      jitter:
        description: Duration string or empty
        type: string
      packet_loss:
        description: Percentage
        type: number
      rate:
        description: Kbit/s
        type: integer
    type: object
  models.NetemResetRequest:
    properties:
      containerName:
        description: Container name to reset impairments on (e.g., "clab-my-lab-srl1").
        example: clab-my-lab-srl1
        type: string
      interface:
        description: Interface name or interface alias to reset impairments on (e.g.,
          "eth1" or "mgmt0").
        example: eth1
        type: string
      labName:
        description: Lab name of the topology node to reset impairments on. Used with
          nodeName instead of containerName.
        example: my-lab
        type: string
      nodeName:
        description: Topology node name to reset impairments on. Used with labName
          instead of containerName.
        example: srl1
        type: string
    required:
    - interface
    type: object
  models.NetemSetRequest:
    properties:
      containerName:
        description: Container name to apply impairments on (e.g., "clab-my-lab-srl1").
        example: clab-my-lab-srl1
        type: string
      corruption:
        description: Percentage (0.0 to 100.0)
        example: 0.1
        type: number
      delay:
        description: Duration string (e.g., "100ms", "1s")
        example: 50ms
        type: string
      interface:
        description: Interface name or interface alias to apply impairments on (e.g.,
          "eth1" or "mgmt0").
        example: eth1
        type: string
      jitter:
        description: Duration string, requires Delay
        example: 5ms
        type: string
      labName:
        description: Lab name of the topology node to apply impairments on. Used with
          nodeName instead of containerName.
        example: my-lab
        type: string
      loss:
        description: Percentage (0.0 to 100.0)
        example: 10.5
        type: number
      nodeName:
        description: Topology node name to apply impairments on. Used with labName
          instead of containerName.
        example: srl1
        type: string
      rate:
        description: Kbit/s (non-negative integer)
        example: 1000
        type: integer
    required:
    - interface
    type: object
  models.NetemShowResponse:
    additionalProperties:
      items:
        $ref: '#/definitions/models.NetemInterfaceInfo'
      type: array
    type: object
  models.NodeBrowserPort:
    properties:
      containerPort:
        type: integer
      description:
        type: string
      hostIp:
        type: string
      hostPort:
        type: integer
      protocol:
        type: string
      proxyPath:
        description: |-
          ProxyPath is set on a lab runtime (c9s), where nodes have no host ports: the
          server proxies HTTP to the node's port under this path, with the caller's token.
        example: /api/v1/labs/lab01/nodes/srl1/ports/80/proxy/
        type: string
    type: object
  models.NodeBrowserPortsResponse:
    properties:
      containerName:
        type: string
      nodeName:
        type: string
      ports:
        items:
          $ref: '#/definitions/models.NodeBrowserPort'
        type: array
    type: object
  models.NodeInterfaceInfo:
    properties:
      interfaces:
        items:
          $ref: '#/definitions/models.InterfaceInfo'
        type: array
      name:
        description: Name of the container node
        type: string
    type: object
  models.NodeStats:
    properties:
      cpuCount:
        description: CPUCount is the number of CPUs the node can use, when known.
        example: 8
        type: integer
      cpuPercent:
        description: |-
          CPUPercent is the CPU usage since the previous sample, where 100 is one busy CPU.
          It is missing in the first sample of a node.
        example: 12.5
        type: number
      memoryBytes:
        example: 536870912
        type: integer
      memoryLimitBytes:
        example: 8589934592
        type: integer
      name:
        description: Name is the container name.
        example: clab-my-lab-srl1
        type: string
      nodeName:
        description: NodeName is the node name in the topology.
        example: srl1
        type: string
      pids:
        example: 42
        type: integer
    type: object
  models.PasswordChangeRequest:
    properties:
      currentPassword:
        description: Required if not superuser
        type: string
      newPassword:
        type: string
    required:
    - newPassword
    type: object
  models.RenderedTopologyResponse:
    properties:
      content:
        description: Content is the rendered topology YAML.
        example: 'name: lab01'
        type: string
      error:
        description: Error is containerlab's error when it rejects the rendered YAML.
        type: string
      labName:
        description: LabName is the rendered top-level name with Git name variables
          expanded.
        example: lab01
        type: string
      path:
        description: Path is the requested workspace-relative topology path.
        example: lab01/lab01.clab.gotmpl
        type: string
      varsFiles:
        description: |-
          VarsFiles lists the variable files used for rendering relative to the
          topology file's directory, including files containerlab discovered next to it.
        example:
        - lab01.clab_vars.yml
        items:
          type: string
        type: array
    type: object
  models.RuntimeImageActionResponse:
    properties:
      image:
        type: string
      message:
        type: string
      output:
        type: string
      success:
        type: boolean
    type: object
  models.RuntimeImagePullRequest:
    properties:
      image:
        type: string
    required:
    - image
    type: object
  models.RuntimeImageSummary:
    properties:
      createdAt:
        type: string
      id:
        type: string
      repoDigests:
        items:
          type: string
        type: array
      repoTags:
        items:
          type: string
        type: array
      shortId:
        type: string
      size:
        type: string
      virtualSize:
        type: string
    type: object
  models.RuntimeImagesResponse:
    properties:
      images:
        items:
          $ref: '#/definitions/models.RuntimeImageSummary'
        type: array
      runtime:
        type: string
    type: object
  models.SSHAccessRequest:
    properties:
      duration:
        description: How long the access should be valid for (e.g., "1h", "30m")
        type: string
      sshUsername:
        description: Optional override for container's SSH user
        type: string
    type: object
  models.SSHAccessResponse:
    properties:
      command:
        description: Example SSH command
        type: string
      expiration:
        description: When this access expires
        type: string
      host:
        description: API server's hostname or IP
        type: string
      port:
        description: Allocated port on API server
        type: integer
      username:
        description: Username to use for SSH
        type: string
    type: object
  models.SSHSessionInfo:
    properties:
      created:
        description: When this access was created
        type: string
      expiration:
        description: When this access expires
        type: string
      labName:
        description: Lab name
        type: string
      nodeName:
        description: Node name
        type: string
      port:
        description: Allocated port on API server
        type: integer
      username:
        description: SSH username
        type: string
    type: object
  models.SSHXShareRequest:
    properties:
      enableReaders:
        description: EnableReaders also creates a read-only access link.
        example: true
        type: boolean
    type: object
  models.SaveConfigResponse:
    properties:
      copyDir:
        description: |-
          CopyDir is the <copy>/<lab dir> directory the configs were copied to when
          copy was requested: workspace-relative, @shared/... or absolute.
        example: lab1/backups/clab-lab1
        type: string
      message:
        description: Message indicating overall success.
        type: string
      output:
        description: Detailed output from the 'clab save' command (often from stderr).
        type: string
    type: object
  models.ServerInfo:
    properties:
      startTime:
        description: When the server started
        type: string
      uptime:
        description: Human-readable uptime
        type: string
      version:
        description: API server version
        type: string
    type: object
  models.ShareToolResponse:
    properties:
      link:
        type: string
      message:
        type: string
      output:
        type: string
      readOnlyLink:
        description: ReadOnlyLink is the SSHX read-only access link when readers are
          enabled.
        type: string
      shell:
        description: Shell is the effective GoTTY shell (attach/reattach only).
        type: string
      username:
        description: Username is the effective GoTTY login name (attach/reattach only).
        type: string
    type: object
  models.SimpleSuccessResponse:
    properties:
      success:
        example: true
        type: boolean
    type: object
  models.SnapshotNodeResult:
    properties:
      durationMs:
        example: 45000
        type: integer
      error:
        type: string
      node:
        example: r1
        type: string
      path:
        description: Path is the snapshot file, workspace-relative (or @shared/...)
          when inside a workspace root.
        example: lab1/snapshots/r1.tar
        type: string
      reason:
        description: Reason explains skipped nodes.
        example: not a vrnetlab node (kind=nokia_srlinux, image=ghcr.io/nokia/srlinux)
        type: string
      sizeBytes:
        example: 104857600
        type: integer
      status:
        description: Status is "success", "failed" or "skipped".
        enum:
        - success
        - failed
        - skipped
        example: success
        type: string
    type: object
  models.SnapshotSaveRequest:
    properties:
      nodes:
        description: Nodes limits the snapshot to these topology node names (all nodes
          when empty).
        example:
        - r1
        - r2
        items:
          type: string
        type: array
      outputDir:
        description: |-
          OutputDir is a path relative to the topology directory, or an absolute path,
          inside the user's workspace (or the shared root for shared labs). Defaults to "snapshots".
        example: snapshots
        type: string
      timeout:
        description: Timeout is the per-node wait as a Go duration (default 5m, maximum
          30m).
        example: 5m
        type: string
    type: object
  models.SnapshotSaveResponse:
    properties:
      outputDir:
        description: OutputDir is workspace-relative (or @shared/...) when inside
          a workspace root.
        example: lab1/snapshots
        type: string
      results:
        items:
          $ref: '#/definitions/models.SnapshotNodeResult'
        type: array
      summary:
        example: 2 succeeded, 0 failed, 1 skipped
        type: string
    type: object
  models.TailscaleDevice:
    properties:
      authUrl:
        description: AuthURL is the login URL to open while the device waits for authentication.
        example: https://login.tailscale.com/a/0123456789ab
        type: string
      backendState:
        description: BackendState is the tailscaled state, e.g. NeedsLogin or Running.
        example: NeedsLogin
        type: string
      containerName:
        example: clab-mylab-ts
        type: string
      dnsName:
        example: clab-mylab.tailnet-1234.ts.net
        type: string
      error:
        description: Error reports why the tailnet state could not be read.
        type: string
      forwards:
        description: Forwards lists the tailnet ports the SSO proxy forwards to nodes
          (/ts ports).
        items:
          $ref: '#/definitions/models.TailscaleForward'
        type: array
      hostName:
        example: clab-mylab
        type: string
      nodeName:
        example: srl1
        type: string
      online:
        type: boolean
      role:
        description: |-
          Role is "proxy" for the SSO proxy (mgmt.tailscale.auth-mode: sso), "sidecar"
          for the auth-key sidecar of nodeName, or "node" for a node of the tailscale kind.
        example: proxy
        type: string
      state:
        example: running
        type: string
      tailscaleIps:
        items:
          type: string
        type: array
    type: object
  models.TailscaleForward:
