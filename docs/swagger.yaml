        Renders a topology file the way containerlab does before deploying it: Go template execution with variables from `<topology name without extension>_vars.{yaml,yml,json}` or `varsPath`, `clab_templates/*.gotmpl` subtemplates, and `${VAR:=default}` environment expansion. Nothing is deployed and no lab state changes.

        **Notes**
        - `path` resolves like the topology file endpoints. `varsPath` is relative to the topology file's directory (like `containerlab --vars` run from there) and must stay inside the topology's workspace.
        - `varsFiles` lists the variable files used, relative to the topology file's directory.
        - A topology that renders but is rejected by containerlab returns 200 with the rendered content and `error` set.
        - Template parse or execution errors return 422.
        Shared workspace paths start with @shared/ when CLAB_SHARED_LABS_ROOT is configured; all authenticated API users can access them.
      parameters:
      - description: Lab name
        in: path
        name: labName
        required: true
        type: string
      - description: Workspace-relative path from the topology listing, or legacy
          lab-relative path
        in: query
        name: path
        required: true
        type: string
      - description: Template variables file relative to the topology file's directory
          (like --vars); defaults to containerlab's vars file discovery
        in: query
        name: varsPath
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Rendered topology
          schema:
            $ref: '#/definitions/models.RenderedTopologyResponse'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Topology or vars file not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
