      - description: Lab name
        in: path
        name: labName
        required: true
        type: string
      - description: Full container name of the node (e.g., clab-my-lab-srl1)
        in: path
        name: nodeName
        required: true
        type: string
      - description: Terminal session creation parameters
        in: body
        name: terminal_request
        required: true
        schema:
          $ref: '#/definitions/models.TerminalSessionRequest'
