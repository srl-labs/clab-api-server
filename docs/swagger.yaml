  /api/v1/terminal-sessions/{sessionId}/stream:
    get:
      description: |-
        Upgrades the request to a WebSocket connection for terminal input, output, resize, and close events.

        **Protocol notes**
        - Connect with a WebSocket client to this endpoint after creating a terminal session.
        - Client messages are JSON objects with `type` set to `input`, `resize`, or `close`.
        - Server messages are JSON objects with `type` set to `ready`, `output`, or `exit`.

        **Reconnecting**
        - A session created with `resumable` keeps running when the connection drops (`ready.resumable` is true). Connect again to continue: the first `output` message replays the session's recent output (`ready.replay` is true then).
        - Any other session ends when its connection closes.
        - Only one client is attached at a time. A new connection takes the session over, and the previous one is closed with code 4001.
        - Send `close` to end the session. A resumable session without a client ends after the server's terminal idle timeout (default 30 minutes).
      parameters:
      - description: Terminal session ID
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols to WebSocket
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Session not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "410":
          description: Session already exited
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Stream terminal session
      tags:
      - Terminal Sessions
