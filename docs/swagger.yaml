        in: query
        name: gracefulTimeout
        type: string
      - description: Keep the management network
        in: query
        name: keepMgmtNet
        type: boolean
      - description: Destroy only specific nodes
        in: query
        name: nodeFilter
        type: string
      - description: Template variables file (like --vars) relative to the lab's topology
          file directory
        in: query
