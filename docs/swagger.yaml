    x-enum-varnames:
    - TerminalProtocolSSH
    - TerminalProtocolShell
    - TerminalProtocolTelnet
  models.TerminalSessionInfo:
    properties:
      attached:
        description: Attached reports whether a client is connected to the session's
          stream.
        type: boolean
      createdAt:
        type: string
      error:
        type: string
      exitCode:
        type: integer
      expiresAt:
        type: string
      labName:
        type: string
      lastActivity:
        type: string
      nodeName:
        type: string
      protocol:
        $ref: '#/definitions/models.TerminalProtocol'
      resumable:
        description: Resumable reports whether the session outlives a disconnected
          stream.
        type: boolean
      sessionId:
        type: string
      state:
        type: string
      username:
        type: string
    type: object
  models.TerminalSessionRequest:
    properties:
      cols:
        description: Cols is the requested terminal width in characters.
        type: integer
      protocol:
        allOf:
        - $ref: '#/definitions/models.TerminalProtocol'
        description: 'Protocol selects the terminal transport: ssh, shell, or telnet.'
      resumable:
        description: |-
          Resumable keeps the session running when its stream disconnects, so the
          client can attach again. Without it the session ends with its stream.
        type: boolean
      rows:
        description: Rows is the requested terminal height in characters.
        type: integer
      sshUsername:
        description: SSHUsername optionally overrides the SSH username for protocol=ssh.
        type: string
      telnetPort:
        description: TelnetPort optionally overrides the telnet destination port for
          protocol=telnet.
        type: integer
    required:
    - protocol
    type: object
  models.TopologyDocEventResponse:
    properties:
