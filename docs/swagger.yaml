        in: query
        name: gracefulTimeout
        type: string
      - description: Keep the management network
        in: query
        name: keepMgmtNet
        type: boolean
      - description: Limit concurrent workers
        in: query
        name: maxWorkers
        type: integer
      - description: Custom Go template file for topology data export
        in: query
        name: exportTemplate
        type: string
      - description: Skip post-deploy actions
        in: query
        name: skipPostDeploy
        type: boolean
      - description: Skip setting extended ACLs on lab directory
        in: query
        name: skipLabdirAcl
        type: boolean
      - description: Template variables file (like --vars) relative to the lab's topology
